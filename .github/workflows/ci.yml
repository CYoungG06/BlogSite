name: CI

# PR 检查:lint + 类型检查 + Python 测试 + 完整构建。
# 主要给 Dependabot 的依赖升级 PR 用 —— 绿了再合,不用本地拉下来验证。
# push 到 main 不在这里跑:Deploy workflow 本身就会完整构建一次。
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test paper fetcher
        run: python3 -B -m unittest discover -s scripts -p 'test_fetch_daily_papers.py'

      - name: Build
        run: npm run build
