name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署 Pages 需要的权限;issues 用于部署失败时提醒
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# 同一时刻只允许一次部署,新的 push 取消进行中的运行
concurrency:
  group: pages
  cancel-in-progress: true

# 全部从 GitHub Repository Variables 读取(Settings → Secrets and variables → Actions → Variables)
# 均为可选,留空等价于不配置;改动后需重跑 workflow 才生效
env:
  NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
  NEXT_PUBLIC_IMAGE_BASE_URL: ${{ vars.NEXT_PUBLIC_IMAGE_BASE_URL }}
  NEXT_PUBLIC_GISCUS_REPO: ${{ vars.NEXT_PUBLIC_GISCUS_REPO }}
  NEXT_PUBLIC_GISCUS_REPO_ID: ${{ vars.NEXT_PUBLIC_GISCUS_REPO_ID }}
  NEXT_PUBLIC_GISCUS_CATEGORY: ${{ vars.NEXT_PUBLIC_GISCUS_CATEGORY }}
  NEXT_PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.NEXT_PUBLIC_GISCUS_CATEGORY_ID }}
  NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
  NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
  NEXT_PUBLIC_AGENT_API: ${{ vars.NEXT_PUBLIC_AGENT_API }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build 前置会自动重建搜索索引(见 package.json scripts)
      - name: Build
        run: npm run build

      # 防止 Jekyll 忽略下划线开头的路径
      - name: Add .nojekyll
        run: touch out/.nojekyll

      # v4 起默认不打包点文件;显式打开,否则上一步的 .nojekyll 进不了产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
          include-hidden-files: true

      # deploy-pages 偶发 "Timeout reached, aborting!"(Pages 侧抖动,产物本身没问题):
      # 首次失败不立刻判死,用同一份产物重试一次
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Retry deploy
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5

      # 部署失败此前没有任何提醒(论文速递会静默停在旧版本)。
      # 与 Daily Papers 同一套做法:只保留一个未关闭的失败 Issue,成功后自动关闭。
      - name: Report failure in issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="Deploy to GitHub Pages 运行失败,线上仍是上一个版本,请查看日志:$RUN_URL"$'\n\n'"时间(UTC):$(date -u +'%F %T')"
          OPEN=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title | startswith("Deploy 失败"))][0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            gh issue create --title "Deploy 失败:$(date -u +%F)" --body "$BODY" --assignee "$OWNER"
          fi

      - name: Close resolved failure issues
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --state open --limit 200 --json number,title \
            --jq '.[] | select(.title | startswith("Deploy 失败")) | .number' |
          while IFS= read -r NUMBER; do
            gh issue close "$NUMBER" --comment "已恢复:$RUN_URL 部署成功,自动关闭。"
          done
