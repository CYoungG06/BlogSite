name = "blogsite-agent-proxy"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Workers Rate Limiting(免费计划可用):每 IP 20 次/分钟
[[ratelimits]]
name = "RATE_LIMITER"
binding = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# DEEPSEEK_API_KEY 用 `npx wrangler secret put DEEPSEEK_API_KEY` 注入,不要写在这里
