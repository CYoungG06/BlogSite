name = "blogsite-agent-proxy"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Workers Rate Limiting(免费计划可用):每 IP 40 次/分钟;name 即绑定名
# 深度调研单轮最多 ~18 次请求(16 工具轮 + 收尾 + 建议),20 /min 会误伤
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 40, period = 60 }

# DEEPSEEK_API_KEY 用 `npx wrangler secret put DEEPSEEK_API_KEY` 注入,不要写在这里

# 全站每日预算(UTC 日,所有访客合计):任一用尽后对话接口当天返回 429,次日自动恢复。
# 这是费用的硬上限 —— 限流是按 IP 的,换 IP 就能绕过,预算绕不过。
# 用量查询:npx wrangler d1 execute blogsite-stats --remote \
#   --command "SELECT * FROM kv WHERE key LIKE 'budget:%' ORDER BY key DESC LIMIT 14"
[vars]
DAILY_REQUEST_BUDGET = "1500"          # 上游请求数;一次普通提问约 2–10 次,深度调研约 18 次
DAILY_INPUT_CHAR_BUDGET = "30000000"   # 发给上游的输入字符数(含服务端 system prompt)

# 全站访客统计(PV/UV):/pv 打点、/stats 查询
# 迁移:npx wrangler d1 migrations apply blogsite-stats(--local / --remote)
[[d1_databases]]
binding = "STATS_DB"
database_name = "blogsite-stats"
database_id = "8a43afcb-4e0d-4879-9796-825dbc62d0ef"
migrations_dir = "migrations"
