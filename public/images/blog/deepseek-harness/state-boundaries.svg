<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness 的三类状态边界</title>
  <desc id="desc">运行时内部状态由 Cordis 生命周期管理，模型可见状态由 Session 事件投影管理，外部副作用由权限、检查点和未知结果标记管理。Code Mode 横跨三者，但不绕开协议。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5f6872"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="#f7f5ef"/>
  <text x="72" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="700" fill="#17202a">一套 Agent runtime，三种不能混为一谈的状态</text>
  <text x="72" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="18" fill="#5d6670">每一类状态都需要不同的承诺；越过边界时，系统只能降级为更弱、但诚实的保证。</text>

  <g filter="url(#shadow)">
    <rect x="70" y="155" width="320" height="430" rx="20" fill="#eef8f5" stroke="#27826f" stroke-width="2"/>
    <rect x="440" y="155" width="320" height="430" rx="20" fill="#eef4fb" stroke="#3f72af" stroke-width="2"/>
    <rect x="810" y="155" width="320" height="430" rx="20" fill="#fff3e9" stroke="#c56b32" stroke-width="2"/>
  </g>

  <circle cx="112" cy="205" r="24" fill="#27826f"/>
  <text x="112" y="212" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#ffffff">1</text>
  <text x="150" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="700" fill="#174e43">运行时内部状态</text>
  <text x="102" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17" fill="#3d514c">
    <tspan x="102" dy="0">服务引用、监听器、连接、插件依赖</tspan>
    <tspan x="102" dy="30">provider 的出现、替换与撤出</tspan>
  </text>
  <line x1="102" y1="325" x2="358" y2="325" stroke="#b8d8cf" stroke-width="2"/>
  <text x="102" y="363" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#174e43">协议：Cordis lifecycle + effect</text>
  <text x="102" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17" fill="#3d514c">
    <tspan x="102" dy="0">依赖消失 → consumer 卸载</tspan>
    <tspan x="102" dy="29">依赖恢复 → 重新装载</tspan>
    <tspan x="102" dy="29">资源注册 → 同时登记 disposer</tspan>
  </text>
  <rect x="102" y="500" width="256" height="54" rx="12" fill="#d5ede6"/>
  <text x="230" y="522" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" fill="#174e43">目标：在框架边界内尽量可撤销</text>
  <text x="230" y="543" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" fill="#3d514c">不等于外部世界自动回滚</text>

  <circle cx="482" cy="205" r="24" fill="#3f72af"/>
  <text x="482" y="212" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#ffffff">2</text>
  <text x="520" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="700" fill="#24476f">模型可见状态</text>
  <text x="472" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17" fill="#43566c">
    <tspan x="472" dy="0">消息、工具结果、摘要、system、schema</tspan>
    <tspan x="472" dy="30">“曾经发生”与“现在给模型看”</tspan>
  </text>
  <line x1="472" y1="325" x2="728" y2="325" stroke="#bed1e8" stroke-width="2"/>
  <text x="472" y="363" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#24476f">协议：raw log + surface 投影</text>
  <text x="472" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17" fill="#43566c">
    <tspan x="472" dy="0">原事件仅追加，不原地改写</tspan>
    <tspan x="472" dy="29">裁剪/摘要追加 replacement</tspan>
    <tspan x="472" dy="29">请求记录 header 与 context</tspan>
  </text>
  <rect x="472" y="500" width="256" height="54" rx="12" fill="#dbe8f6"/>
  <text x="600" y="522" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" fill="#24476f">目标：上下文可变，来路可解释</text>
  <text x="600" y="543" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" fill="#43566c">不等于保存进程的全部中间值</text>

  <circle cx="852" cy="205" r="24" fill="#c56b32"/>
  <text x="852" y="212" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="700" fill="#ffffff">3</text>
  <text x="890" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="700" fill="#7b3f1d">外部世界状态</text>
  <text x="842" y="258" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17" fill="#684f40">
    <tspan x="842" dy="0">文件写入、进程、网络请求、远程 API</tspan>
    <tspan x="842" dy="30">可能已经生效，却来不及记录结果</tspan>
  </text>
  <line x1="842" y1="325" x2="1098" y2="325" stroke="#e9c9b4" stroke-width="2"/>
  <text x="842" y="354" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700" fill="#7b3f1d">
    <tspan x="842" dy="0">协议：policy + checkpoint</tspan>
    <tspan x="842" dy="24">+ repair</tspan>
  </text>
  <text x="842" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="16" fill="#684f40">
    <tspan x="842" dy="0">执行前校验、审批并 flush intent</tspan>
    <tspan x="842" dy="26">已知未开始 / 已知结果</tspan>
    <tspan x="842" dy="26">其余结果明确标为</tspan>
    <tspan x="842" dy="23" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">TOOL_OUTCOME_UNKNOWN</tspan>
  </text>
  <rect x="842" y="514" width="256" height="48" rx="12" fill="#f8dfcf"/>
  <text x="970" y="534" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" fill="#7b3f1d">目标：限制、记账、核验与补偿</text>
  <text x="970" y="553" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13" fill="#684f40">不承诺 exactly-once</text>

  <path d="M 390 370 C 415 370, 415 370, 438 370" fill="none" stroke="#5f6872" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 760 370 C 785 370, 785 370, 808 370" fill="none" stroke="#5f6872" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="70" y="628" width="1060" height="78" rx="18" fill="#202b3c"/>
  <text x="104" y="661" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="700" fill="#f4cc78">Code Mode：重新编排调用粒度</text>
  <text x="104" y="689" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17" fill="#e4e9ef">程序内可保留结构化中间值，但每个副调用仍进入原生权限管线；dispatch 可审计，只有外层结果进入模型 surface。</text>
</svg>
