<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" aria-labelledby="title desc" role="img" viewBox="0 0 1200 760"><title id="title">DeepSeek Harness 的三类状态边界</title><desc id="desc">运行时内部状态由 Cordis 生命周期管理，模型可见状态由 Session 事件投影管理，外部副作用由权限、检查点和未知结果标记管理。Code Mode 横跨三者，但不绕开协议。</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#5f6872" d="M 0 0 L 10 5 L 0 10 z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="5" flood-color="#1f2937" flood-opacity=".1" stdDeviation="8"/></filter></defs><rect width="1200" height="760" fill="#f7f5ef"/><text x="72" y="70" fill="#17202a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="34" font-weight="700">一套 Agent runtime，三种不能混为一谈的状态</text><text x="72" y="106" fill="#5d6670" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="18">每一类状态都需要不同的承诺；越过边界时，系统只能降级为更弱、但诚实的保证。</text><g filter="url(#shadow)"><rect width="320" height="430" x="70" y="155" fill="#eef8f5" stroke="#27826f" stroke-width="2" rx="20"/><rect width="320" height="430" x="440" y="155" fill="#eef4fb" stroke="#3f72af" stroke-width="2" rx="20"/><rect width="320" height="430" x="810" y="155" fill="#fff3e9" stroke="#c56b32" stroke-width="2" rx="20"/></g><circle cx="112" cy="205" r="24" fill="#27826f"/><text x="112" y="212" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="700" text-anchor="middle">1</text><text x="150" y="211" fill="#174e43" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="700">运行时内部状态</text><text x="102" y="258" fill="#3d514c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17"><tspan x="102" dy="0">服务引用、监听器、连接、插件依赖</tspan> <tspan x="102" dy="30">provider 的出现、替换与撤出</tspan></text><line x1="102" x2="358" y1="325" y2="325" stroke="#b8d8cf" stroke-width="2"/><text x="102" y="363" fill="#174e43" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700">协议：Cordis lifecycle + effect</text><text x="102" y="402" fill="#3d514c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17"><tspan x="102" dy="0">依赖消失 → consumer 卸载</tspan> <tspan x="102" dy="29">依赖恢复 → 重新装载</tspan> <tspan x="102" dy="29">资源注册 → 同时登记 disposer</tspan></text><rect width="256" height="54" x="102" y="500" fill="#d5ede6" rx="12"/><text x="230" y="522" fill="#174e43" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle">目标：在框架边界内尽量可撤销</text><text x="230" y="543" fill="#3d514c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" text-anchor="middle">不等于外部世界自动回滚</text><circle cx="482" cy="205" r="24" fill="#3f72af"/><text x="482" y="212" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="700" text-anchor="middle">2</text><text x="520" y="211" fill="#24476f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="700">模型可见状态</text><text x="472" y="258" fill="#43566c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17"><tspan x="472" dy="0">消息、工具结果、摘要、system、schema</tspan> <tspan x="472" dy="30">“曾经发生”与“现在给模型看”</tspan></text><line x1="472" x2="728" y1="325" y2="325" stroke="#bed1e8" stroke-width="2"/><text x="472" y="363" fill="#24476f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700">协议：raw log + surface 投影</text><text x="472" y="402" fill="#43566c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17"><tspan x="472" dy="0">原事件仅追加，不原地改写</tspan> <tspan x="472" dy="29">裁剪/摘要追加 replacement</tspan> <tspan x="472" dy="29">请求记录 header 与 context</tspan></text><rect width="256" height="54" x="472" y="500" fill="#dbe8f6" rx="12"/><text x="600" y="522" fill="#24476f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle">目标：上下文可变，来路可解释</text><text x="600" y="543" fill="#43566c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" text-anchor="middle">不等于保存进程的全部中间值</text><circle cx="852" cy="205" r="24" fill="#c56b32"/><text x="852" y="212" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="21" font-weight="700" text-anchor="middle">3</text><text x="890" y="211" fill="#7b3f1d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="25" font-weight="700">外部世界状态</text><text x="842" y="258" fill="#684f40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17"><tspan x="842" dy="0">文件写入、进程、网络请求、远程 API</tspan> <tspan x="842" dy="30">可能已经生效，却来不及记录结果</tspan></text><line x1="842" x2="1098" y1="325" y2="325" stroke="#e9c9b4" stroke-width="2"/><text x="842" y="354" fill="#7b3f1d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700"><tspan x="842" dy="0">协议：policy + checkpoint</tspan> <tspan x="842" dy="24">+ repair</tspan></text><text x="842" y="414" fill="#684f40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="16"><tspan x="842" dy="0">执行前校验、审批并 flush intent</tspan> <tspan x="842" dy="26">已知未开始 / 已知结果</tspan> <tspan x="842" dy="26">其余结果明确标为</tspan> <tspan x="842" dy="23" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">TOOL_OUTCOME_UNKNOWN</tspan></text><rect width="256" height="48" x="842" y="514" fill="#f8dfcf" rx="12"/><text x="970" y="534" fill="#7b3f1d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" text-anchor="middle">目标：限制、记账、核验与补偿</text><text x="970" y="553" fill="#684f40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13" text-anchor="middle">不承诺 exactly-once</text><path fill="none" stroke="#5f6872" stroke-width="2.5" marker-end="url(#arrow)" d="M 390 370 C 415 370, 415 370, 438 370"/><path fill="none" stroke="#5f6872" stroke-width="2.5" marker-end="url(#arrow)" d="M 760 370 C 785 370, 785 370, 808 370"/><rect width="1060" height="78" x="70" y="628" fill="#202b3c" rx="18"/><text x="104" y="661" fill="#f4cc78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="19" font-weight="700">Code Mode：重新编排调用粒度</text><text x="104" y="689" fill="#e4e9ef" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17">程序内可保留结构化中间值，但每个副调用仍进入原生权限管线；dispatch 可审计，只有外层结果进入模型 surface。</text></svg>