<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" aria-labelledby="title desc" role="img" viewBox="0 0 1200 820"><title id="title">DeepSeek Harness Session 的日志、surface 和请求快照</title><desc id="desc">原始事件只追加，新的替换事件通过 provenance 遮蔽旧工具结果，deriveMessages 生成模型可见 surface，再与请求头组成实际模型请求。下方展示崩溃恢复的三种判断。</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#657180" d="M 0 0 L 10 5 L 0 10 z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#1f2937" flood-opacity=".1" stdDeviation="7"/></filter></defs><rect width="1200" height="820" fill="#f7f5ef"/><text x="62" y="62" fill="#17202a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="32" font-weight="700">同一场会话，同时保存“事实”和“给模型看的版本”</text><text x="62" y="97" fill="#5d6670" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17">raw log 永不原地修改；surface 可以变化；header 在初始、恢复或变化时落盘，context 另记路由与容量。</text><g filter="url(#shadow)"><rect width="390" height="450" x="60" y="140" fill="#fff" stroke="#516a86" stroke-width="2" rx="18"/><rect width="270" height="450" x="500" y="140" fill="#eef4fb" stroke="#3f72af" stroke-width="2" rx="18"/><rect width="320" height="450" x="820" y="140" fill="#eef8f5" stroke="#27826f" stroke-width="2" rx="18"/></g><text x="88" y="183" fill="#304760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700">① append-only raw log</text><text x="88" y="211" fill="#68727e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">seq === log.length · typed · frozen</text><rect width="334" height="56" x="88" y="239" fill="#edf1f5" rx="10"/><text x="108" y="263" fill="#34495e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700">39 assistant/message</text><text x="108" y="283" fill="#596777" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14">“我先搜索整个仓库”</text><rect width="334" height="84" x="88" y="310" fill="#e5edf7" stroke="#7b9dc4" rx="10"/><text x="108" y="335" fill="#24476f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700">40 tool/result · 完整结果</text><text x="108" y="358" fill="#4f6480" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">surfaceOp: append</text><text x="108" y="380" fill="#596777" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14">三万行搜索输出仍保留在日志</text><text x="255" y="425" fill="#9aa3ad" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="22" text-anchor="middle">⋮</text><rect width="334" height="108" x="88" y="446" fill="#fff0df" stroke="#c7803f" stroke-width="2" rx="10"/><text x="108" y="472" fill="#7b461d" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700">87 tool/result · 裁剪版本</text><text x="108" y="496" fill="#76563d" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">surfaceOp: replace</text><text x="108" y="518" fill="#76563d" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">sourceEventSeqs: [40]</text><text x="108" y="541" fill="#596777" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14">追加新事实，不删除 seq 40</text><path fill="none" stroke="#657180" stroke-width="2.5" marker-end="url(#arrow)" d="M 450 365 C 470 365, 475 365, 498 365"/><text x="475" y="344" fill="#657180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13" text-anchor="middle">投影</text><text x="528" y="183" fill="#24476f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700">② current surface</text><text x="528" y="211" fill="#68727e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">deriveMessages()</text><rect width="214" height="66" x="528" y="250" fill="#fff" stroke="#b8cbe1" rx="10"/><text x="546" y="277" fill="#34495e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">assistant/message</text><text x="546" y="299" fill="#596777" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14">搜索仓库</text><rect width="214" height="84" x="528" y="334" fill="#fff0df" stroke="#c7803f" stroke-width="2" rx="10"/><text x="546" y="361" fill="#7b461d" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">tool/result · seq 87</text><text x="546" y="384" fill="#596777" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14">短结果进入下一轮</text><text x="546" y="405" fill="#8a6545" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13">seq 40 被遮蔽，未被删除</text><rect width="214" height="92" x="528" y="450" fill="#dbe8f6" rx="10"/><text x="635" y="478" fill="#24476f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle">surface 的回答</text><text x="635" y="503" fill="#43566c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" text-anchor="middle">“模型此刻应该记得什么？”</text><text x="635" y="527" fill="#657180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13" text-anchor="middle">并不冒充完整审计历史</text><path fill="none" stroke="#657180" stroke-width="2.5" marker-end="url(#arrow)" d="M 770 365 C 790 365, 795 365, 818 365"/><text x="848" y="183" fill="#174e43" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700">③ request state</text><text x="848" y="211" fill="#68727e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14">请求构造与路由观测分开记录</text><rect width="264" height="98" x="848" y="245" fill="#fff" stroke="#acd4ca" rx="10"/><text x="868" y="272" fill="#174e43" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700">request/header</text><text x="868" y="294" fill="#53645f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13">provider · model · reasoning · sampling</text><text x="868" y="316" fill="#53645f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13">adapter defaults · system · tools</text><text x="868" y="336" fill="#68727e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="12">用于构造并比较请求 header</text><rect width="264" height="78" x="848" y="359" fill="#fff" stroke="#acd4ca" rx="10"/><text x="868" y="386" fill="#174e43" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700">request/context</text><text x="868" y="408" fill="#53645f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13">provider · actual model · capacity</text><text x="868" y="428" fill="#68727e" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="12">只用于路由与容量观测</text><rect width="264" height="89" x="848" y="453" fill="#d5ede6" rx="10"/><text x="980" y="481" fill="#174e43" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" text-anchor="middle">messages = current surface</text><text x="980" y="508" fill="#53645f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" text-anchor="middle">在 durable boundary 上构造</text><text x="980" y="529" fill="#657180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13" text-anchor="middle">可选 invariant companion 可做一致性检查</text><text x="62" y="644" fill="#17202a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700">崩溃恢复只作有证据的判断</text><line x1="62" x2="1138" y1="662" y2="662" stroke="#d4d0c7" stroke-width="2"/><rect width="324" height="83" x="62" y="687" fill="#edf1f5" rx="14"/><text x="224" y="715" fill="#34495e" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" text-anchor="middle">tool/call 未持久化</text><text x="224" y="745" fill="#596777" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" text-anchor="middle">TOOL_NOT_STARTED</text><rect width="324" height="83" x="438" y="687" fill="#dff0e9" rx="14"/><text x="600" y="715" fill="#174e43" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" text-anchor="middle">call + result 均持久化</text><text x="600" y="745" fill="#53645f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" text-anchor="middle">结果已知，可继续</text><rect width="324" height="83" x="814" y="687" fill="#fff0df" stroke="#c7803f" rx="14"/><text x="976" y="715" fill="#7b461d" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" text-anchor="middle">call 有，result 无</text><text x="976" y="745" fill="#76563d" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" text-anchor="middle">TOOL_OUTCOME_UNKNOWN</text></svg>