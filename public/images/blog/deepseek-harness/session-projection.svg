<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness Session 的日志、surface 和请求快照</title>
  <desc id="desc">原始事件只追加，新的替换事件通过 provenance 遮蔽旧工具结果，deriveMessages 生成模型可见 surface，再与请求头组成实际模型请求。下方展示崩溃恢复的三种判断。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#657180"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="820" fill="#f7f5ef"/>
  <text x="62" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="32" font-weight="700" fill="#17202a">同一场会话，同时保存“事实”和“给模型看的版本”</text>
  <text x="62" y="97" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17" fill="#5d6670">raw log 永不原地修改；surface 可以变化；header 在初始、恢复或变化时落盘，context 另记路由与容量。</text>

  <g filter="url(#shadow)">
    <rect x="60" y="140" width="390" height="450" rx="18" fill="#ffffff" stroke="#516a86" stroke-width="2"/>
    <rect x="500" y="140" width="270" height="450" rx="18" fill="#eef4fb" stroke="#3f72af" stroke-width="2"/>
    <rect x="820" y="140" width="320" height="450" rx="18" fill="#eef8f5" stroke="#27826f" stroke-width="2"/>
  </g>

  <text x="88" y="183" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700" fill="#304760">① append-only raw log</text>
  <text x="88" y="211" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#68727e">seq === log.length · typed · frozen</text>

  <rect x="88" y="239" width="334" height="56" rx="10" fill="#edf1f5"/>
  <text x="108" y="263" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#34495e">39  assistant/message</text>
  <text x="108" y="283" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" fill="#596777">“我先搜索整个仓库”</text>

  <rect x="88" y="310" width="334" height="84" rx="10" fill="#e5edf7" stroke="#7b9dc4"/>
  <text x="108" y="335" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#24476f">40  tool/result · 完整结果</text>
  <text x="108" y="358" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#4f6480">surfaceOp: append</text>
  <text x="108" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" fill="#596777">三万行搜索输出仍保留在日志</text>

  <text x="255" y="425" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="22" fill="#9aa3ad">⋮</text>

  <rect x="88" y="446" width="334" height="108" rx="10" fill="#fff0df" stroke="#c7803f" stroke-width="2"/>
  <text x="108" y="472" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#7b461d">87  tool/result · 裁剪版本</text>
  <text x="108" y="496" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#76563d">surfaceOp: replace</text>
  <text x="108" y="518" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#76563d">sourceEventSeqs: [40]</text>
  <text x="108" y="541" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" fill="#596777">追加新事实，不删除 seq 40</text>

  <path d="M 450 365 C 470 365, 475 365, 498 365" fill="none" stroke="#657180" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="475" y="344" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13" fill="#657180">投影</text>

  <text x="528" y="183" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700" fill="#24476f">② current surface</text>
  <text x="528" y="211" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#68727e">deriveMessages()</text>

  <rect x="528" y="250" width="214" height="66" rx="10" fill="#ffffff" stroke="#b8cbe1"/>
  <text x="546" y="277" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#34495e">assistant/message</text>
  <text x="546" y="299" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" fill="#596777">搜索仓库</text>

  <rect x="528" y="334" width="214" height="84" rx="10" fill="#fff0df" stroke="#c7803f" stroke-width="2"/>
  <text x="546" y="361" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#7b461d">tool/result · seq 87</text>
  <text x="546" y="384" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" fill="#596777">短结果进入下一轮</text>
  <text x="546" y="405" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13" fill="#8a6545">seq 40 被遮蔽，未被删除</text>

  <rect x="528" y="450" width="214" height="92" rx="10" fill="#dbe8f6"/>
  <text x="635" y="478" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" fill="#24476f">surface 的回答</text>
  <text x="635" y="503" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" fill="#43566c">“模型此刻应该记得什么？”</text>
  <text x="635" y="527" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13" fill="#657180">并不冒充完整审计历史</text>

  <path d="M 770 365 C 790 365, 795 365, 818 365" fill="none" stroke="#657180" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="848" y="183" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700" fill="#174e43">③ request state</text>
  <text x="848" y="211" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" fill="#68727e">请求构造与路由观测分开记录</text>

  <rect x="848" y="245" width="264" height="98" rx="10" fill="#ffffff" stroke="#acd4ca"/>
  <text x="868" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#174e43">request/header</text>
  <text x="868" y="294" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13" fill="#53645f">provider · model · reasoning · sampling</text>
  <text x="868" y="316" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13" fill="#53645f">adapter defaults · system · tools</text>
  <text x="868" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="12" fill="#68727e">用于构造并比较请求 header</text>

  <rect x="848" y="359" width="264" height="78" rx="10" fill="#ffffff" stroke="#acd4ca"/>
  <text x="868" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#174e43">request/context</text>
  <text x="868" y="408" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13" fill="#53645f">provider · actual model · capacity</text>
  <text x="868" y="428" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="12" fill="#68727e">只用于路由与容量观测</text>

  <rect x="848" y="453" width="264" height="89" rx="10" fill="#d5ede6"/>
  <text x="980" y="481" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#174e43">messages = current surface</text>
  <text x="980" y="508" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" fill="#53645f">在 durable boundary 上构造</text>
  <text x="980" y="529" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="13" fill="#657180">可选 invariant companion 可做一致性检查</text>

  <text x="62" y="644" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" fill="#17202a">崩溃恢复只作有证据的判断</text>
  <line x1="62" y1="662" x2="1138" y2="662" stroke="#d4d0c7" stroke-width="2"/>

  <rect x="62" y="687" width="324" height="83" rx="14" fill="#edf1f5"/>
  <text x="224" y="715" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#34495e">tool/call 未持久化</text>
  <text x="224" y="745" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#596777">TOOL_NOT_STARTED</text>

  <rect x="438" y="687" width="324" height="83" rx="14" fill="#dff0e9"/>
  <text x="600" y="715" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#174e43">call + result 均持久化</text>
  <text x="600" y="745" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" fill="#53645f">结果已知，可继续</text>

  <rect x="814" y="687" width="324" height="83" rx="14" fill="#fff0df" stroke="#c7803f"/>
  <text x="976" y="715" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700" fill="#7b461d">call 有，result 无</text>
  <text x="976" y="745" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#76563d">TOOL_OUTCOME_UNKNOWN</text>
</svg>
