<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" aria-labelledby="title desc" role="img" viewBox="0 0 1200 860"><title id="title">DeepSeek Harness Code Mode 的执行与数据通道</title><desc id="desc">模型只调用 run_code，新 Worker 中的 TypeScript SDK 发起原生工具副调用。副调用经过校验、策略、审批、执行和提交，结果分别进入程序内值、持久审计和模型 surface 三条通道。</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#657180" d="M 0 0 L 10 5 L 0 10 z"/></marker><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="4" flood-color="#1f2937" flood-opacity=".1" stdDeviation="7"/></filter></defs><rect width="1200" height="860" fill="#f7f5ef"/><text x="60" y="60" fill="#17202a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="32" font-weight="700">Code Mode：程序负责局部编排，Harness 仍掌握工具协议</text><text x="60" y="95" fill="#5d6670" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17">`run_code` 改变模型往返次数，不合并权限，也不把副调用从审计链中抹掉。</text><g filter="url(#shadow)"><rect width="220" height="100" x="60" y="132" fill="#202b3c" rx="16"/><rect width="300" height="100" x="340" y="132" fill="#eef4fb" stroke="#3f72af" stroke-width="2" rx="16"/><rect width="440" height="100" x="700" y="132" fill="#eef8f5" stroke="#27826f" stroke-width="2" rx="16"/></g><text x="170" y="171" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" text-anchor="middle">模型</text><text x="170" y="201" fill="#f4cc78" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" text-anchor="middle">tool: run_code</text><text x="490" y="171" fill="#24476f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" text-anchor="middle">全新 Node Worker</text><text x="490" y="200" fill="#43566c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15" text-anchor="middle">生成的 TypeScript SDK · env {}</text><text x="920" y="169" fill="#174e43" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" text-anchor="middle">SDK 副调用</text><text x="920" y="201" fill="#3d514c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" text-anchor="middle">tools.grep() · tools.read() · tools.edit()</text><path stroke="#657180" stroke-width="2.5" marker-end="url(#arrow)" d="M 280 182 L 338 182"/><path stroke="#657180" stroke-width="2.5" marker-end="url(#arrow)" d="M 640 182 L 698 182"/><rect width="1080" height="146" x="60" y="276" fill="#fff" stroke="#66788a" stroke-width="2" filter="url(#shadow)" rx="18"/><text x="88" y="313" fill="#304760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="700">每个实际启动的副调用都进入原生 ToolExecution 管线</text><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle"><rect width="132" height="52" x="88" y="339" fill="#edf1f5" rx="10"/><text x="154" y="371" fill="#34495e">参数校验</text><rect width="132" height="52" x="244" y="339" fill="#edf1f5" rx="10"/><text x="310" y="371" fill="#34495e">pre-execute</text><rect width="132" height="52" x="400" y="339" fill="#fff0df" rx="10"/><text x="466" y="371" fill="#7b461d">policy / guard</text><rect width="132" height="52" x="556" y="339" fill="#fff0df" rx="10"/><text x="622" y="371" fill="#7b461d">人工审批</text><rect width="132" height="52" x="712" y="339" fill="#dff0e9" rx="10"/><text x="778" y="371" fill="#174e43">execute body</text><rect width="132" height="52" x="868" y="339" fill="#edf1f5" rx="10"/><text x="934" y="371" fill="#34495e">post-execute</text><rect width="88" height="52" x="1024" y="339" fill="#dbe8f6" rx="10"/><text x="1068" y="371" fill="#24476f">提交</text></g><g stroke="#8a95a1" stroke-width="2" marker-end="url(#arrow)"><path d="M 220 365 L 242 365"/><path d="M 376 365 L 398 365"/><path d="M 532 365 L 554 365"/><path d="M 688 365 L 710 365"/><path d="M 844 365 L 866 365"/><path d="M 1000 365 L 1022 365"/></g><text x="60" y="474" fill="#17202a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700">一个副调用，分流成三种表示</text><g filter="url(#shadow)"><rect width="330" height="188" x="60" y="500" fill="#eef4fb" stroke="#3f72af" stroke-width="2" rx="16"/><rect width="330" height="188" x="435" y="500" fill="#eef8f5" stroke="#27826f" stroke-width="2" rx="16"/><rect width="330" height="188" x="810" y="500" fill="#fff3e9" stroke="#c56b32" stroke-width="2" rx="16"/></g><circle cx="102" cy="543" r="22" fill="#3f72af"/><text x="102" y="550" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="700" text-anchor="middle">A</text><text x="139" y="549" fill="#24476f" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700">程序内 canonical value</text><text x="88" y="590" fill="#43566c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15"><tspan x="88" dy="0">结构化对象返回当前 worker</tspan> <tspan x="88" dy="27">供后续 TypeScript 过滤、分支、聚合</tspan> <tspan x="88" dy="27">不写 Session，replay 无法恢复</tspan></text><circle cx="477" cy="543" r="22" fill="#27826f"/><text x="477" y="550" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="700" text-anchor="middle">B</text><text x="514" y="549" fill="#174e43" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700">durable dispatch</text><text x="463" y="590" fill="#3d514c" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15"><tspan x="463" dy="0">start 先落盘；settle 再记渲染内容</tspan> <tspan x="463" dy="27">供 Trajectory、UI 与审计</tspan> <tspan x="463" dy="27">不进入 deriveMessages()</tspan></text><circle cx="852" cy="543" r="22" fill="#c56b32"/><text x="852" y="550" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="700" text-anchor="middle">C</text><text x="889" y="549" fill="#7b3f1d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700">外层模型结果</text><text x="838" y="590" fill="#684f40" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15"><tspan x="838" dy="0">run_code 的 logs + final return</tspan> <tspan x="838" dy="27">作为外层 tool/result 进入 surface</tspan> <tspan x="838" dy="27">下一轮模型只看这一层</tspan></text><path fill="none" stroke="#3f72af" stroke-width="2" marker-end="url(#arrow)" d="M 770 422 C 600 454, 300 452, 225 498"/><path fill="none" stroke="#27826f" stroke-width="2" marker-end="url(#arrow)" d="M 930 422 C 800 458, 650 456, 600 498"/><path fill="none" stroke="#c56b32" stroke-width="2" marker-end="url(#arrow)" d="M 1068 422 C 1085 452, 1020 467, 975 498"/><rect width="1080" height="82" x="60" y="730" fill="#202b3c" rx="16"/><text x="88" y="762" fill="#f4cc78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700">并发纪律</text><text x="88" y="790" fill="#e4e9ef" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="16">只有明确标记 concurrency-safe 的 body 才重叠（默认最多 10 个）；exclusive 调用等待排空，并把屏障持有到 post-execute commit。</text><text x="88" y="836" fill="#657180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14">Worker 默认：60s active compute · 600s wall · 512MB old generation · 64MiB 外层输出。限制故障范围，不提供事务回滚或恶意代码隔离。</text></svg>