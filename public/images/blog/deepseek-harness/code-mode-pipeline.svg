<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness Code Mode 的执行与数据通道</title>
  <desc id="desc">模型只调用 run_code，新 Worker 中的 TypeScript SDK 发起原生工具副调用。副调用经过校验、策略、审批、执行和提交，结果分别进入程序内值、持久审计和模型 surface 三条通道。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#657180"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1f2937" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="860" fill="#f7f5ef"/>
  <text x="60" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="32" font-weight="700" fill="#17202a">Code Mode：程序负责局部编排，Harness 仍掌握工具协议</text>
  <text x="60" y="95" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17" fill="#5d6670">`run_code` 改变模型往返次数，不合并权限，也不把副调用从审计链中抹掉。</text>

  <g filter="url(#shadow)">
    <rect x="60" y="132" width="220" height="100" rx="16" fill="#202b3c"/>
    <rect x="340" y="132" width="300" height="100" rx="16" fill="#eef4fb" stroke="#3f72af" stroke-width="2"/>
    <rect x="700" y="132" width="440" height="100" rx="16" fill="#eef8f5" stroke="#27826f" stroke-width="2"/>
  </g>
  <text x="170" y="171" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" fill="#ffffff">模型</text>
  <text x="170" y="201" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#f4cc78">tool: run_code</text>
  <text x="490" y="171" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" fill="#24476f">全新 Node Worker</text>
  <text x="490" y="200" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15" fill="#43566c">生成的 TypeScript SDK · env {}</text>
  <text x="920" y="169" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" fill="#174e43">SDK 副调用</text>
  <text x="920" y="201" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#3d514c">tools.grep() · tools.read() · tools.edit()</text>
  <path d="M 280 182 L 338 182" stroke="#657180" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 640 182 L 698 182" stroke="#657180" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="60" y="276" width="1080" height="146" rx="18" fill="#ffffff" stroke="#66788a" stroke-width="2" filter="url(#shadow)"/>
  <text x="88" y="313" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="700" fill="#304760">每个实际启动的副调用都进入原生 ToolExecution 管线</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <rect x="88" y="339" width="132" height="52" rx="10" fill="#edf1f5"/><text x="154" y="371" fill="#34495e">参数校验</text>
    <rect x="244" y="339" width="132" height="52" rx="10" fill="#edf1f5"/><text x="310" y="371" fill="#34495e">pre-execute</text>
    <rect x="400" y="339" width="132" height="52" rx="10" fill="#fff0df"/><text x="466" y="371" fill="#7b461d">policy / guard</text>
    <rect x="556" y="339" width="132" height="52" rx="10" fill="#fff0df"/><text x="622" y="371" fill="#7b461d">人工审批</text>
    <rect x="712" y="339" width="132" height="52" rx="10" fill="#dff0e9"/><text x="778" y="371" fill="#174e43">execute body</text>
    <rect x="868" y="339" width="132" height="52" rx="10" fill="#edf1f5"/><text x="934" y="371" fill="#34495e">post-execute</text>
    <rect x="1024" y="339" width="88" height="52" rx="10" fill="#dbe8f6"/><text x="1068" y="371" fill="#24476f">提交</text>
  </g>
  <g stroke="#8a95a1" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 220 365 L 242 365"/><path d="M 376 365 L 398 365"/><path d="M 532 365 L 554 365"/>
    <path d="M 688 365 L 710 365"/><path d="M 844 365 L 866 365"/><path d="M 1000 365 L 1022 365"/>
  </g>

  <text x="60" y="474" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" fill="#17202a">一个副调用，分流成三种表示</text>

  <g filter="url(#shadow)">
    <rect x="60" y="500" width="330" height="188" rx="16" fill="#eef4fb" stroke="#3f72af" stroke-width="2"/>
    <rect x="435" y="500" width="330" height="188" rx="16" fill="#eef8f5" stroke="#27826f" stroke-width="2"/>
    <rect x="810" y="500" width="330" height="188" rx="16" fill="#fff3e9" stroke="#c56b32" stroke-width="2"/>
  </g>

  <circle cx="102" cy="543" r="22" fill="#3f72af"/>
  <text x="102" y="550" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#fff">A</text>
  <text x="139" y="549" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" fill="#24476f">程序内 canonical value</text>
  <text x="88" y="590" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15" fill="#43566c">
    <tspan x="88" dy="0">结构化对象返回当前 worker</tspan>
    <tspan x="88" dy="27">供后续 TypeScript 过滤、分支、聚合</tspan>
    <tspan x="88" dy="27">不写 Session，replay 无法恢复</tspan>
  </text>

  <circle cx="477" cy="543" r="22" fill="#27826f"/>
  <text x="477" y="550" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#fff">B</text>
  <text x="514" y="549" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" fill="#174e43">durable dispatch</text>
  <text x="463" y="590" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15" fill="#3d514c">
    <tspan x="463" dy="0">start 先落盘；settle 再记渲染内容</tspan>
    <tspan x="463" dy="27">供 Trajectory、UI 与审计</tspan>
    <tspan x="463" dy="27">不进入 deriveMessages()</tspan>
  </text>

  <circle cx="852" cy="543" r="22" fill="#c56b32"/>
  <text x="852" y="550" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#fff">C</text>
  <text x="889" y="549" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="20" font-weight="700" fill="#7b3f1d">外层模型结果</text>
  <text x="838" y="590" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="15" fill="#684f40">
    <tspan x="838" dy="0">run_code 的 logs + final return</tspan>
    <tspan x="838" dy="27">作为外层 tool/result 进入 surface</tspan>
    <tspan x="838" dy="27">下一轮模型只看这一层</tspan>
  </text>

  <path d="M 770 422 C 600 454, 300 452, 225 498" fill="none" stroke="#3f72af" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 930 422 C 800 458, 650 456, 600 498" fill="none" stroke="#27826f" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1068 422 C 1085 452, 1020 467, 975 498" fill="none" stroke="#c56b32" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="730" width="1080" height="82" rx="16" fill="#202b3c"/>
  <text x="88" y="762" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="17" font-weight="700" fill="#f4cc78">并发纪律</text>
  <text x="88" y="790" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="16" fill="#e4e9ef">只有明确标记 concurrency-safe 的 body 才重叠（默认最多 10 个）；exclusive 调用等待排空，并把屏障持有到 post-execute commit。</text>
  <text x="88" y="836" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans CJK SC',sans-serif" font-size="14" fill="#657180">Worker 默认：60s active compute · 600s wall · 512MB old generation · 64MiB 外层输出。限制故障范围，不提供事务回滚或恶意代码隔离。</text>
</svg>
