<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" role="img" aria-labelledby="title desc">
  <title id="title">Harness Evolution 的三类数据职责</title>
  <desc id="desc">Search set 为 optimizer 提供轨迹并产生候选，Gate set 反复决定候选晋升，Final test 在搜索结束前保持独立。公平比较还要配平起点、推理和反馈预算、种子与最终测试预算。</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#24211d" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#625c54"/>
    </marker>
    <style>
      .sans { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      .title { font-size: 42px; font-weight: 760; fill: #211f1b; }
      .subtitle { font-size: 20px; fill: #6d665d; }
      .cardTitle { font-size: 27px; font-weight: 760; fill: #25221e; }
      .cardSub { font-size: 18px; font-weight: 680; fill: #625c54; }
      .body { font-size: 20px; fill: #4f4a44; }
      .budgetHead { font-size: 23px; font-weight: 740; fill: #27241f; }
      .chip { font-size: 18px; font-weight: 650; fill: #393530; }
      .note { font-size: 19px; fill: #5d574f; }
      .arrowLabel { font-size: 16px; font-weight: 650; fill: #625c54; }
    </style>
  </defs>

  <rect width="1600" height="790" fill="#f7f3ea"/>
  <circle cx="1510" cy="80" r="170" fill="#4f7ca2" opacity="0.06"/>
  <text class="sans title" x="74" y="76">一项 Harness 增益要穿过三道证据</text>
  <text class="sans subtitle" x="76" y="116">数据是否暴露只是第一问，更关键的是它有没有参与候选生成或版本选择</text>
  <text class="sans arrowLabel" x="800" y="151" text-anchor="middle">三份数据始终隔离，流动的是候选版本</text>

  <g filter="url(#shadow)" class="sans">
    <rect x="74" y="170" width="410" height="328" rx="26" fill="#edf4f8" stroke="#7b9db8" stroke-width="2"/>
    <rect x="595" y="170" width="410" height="328" rx="26" fill="#fbf1d8" stroke="#c99a45" stroke-width="2"/>
    <rect x="1116" y="170" width="410" height="328" rx="26" fill="#e9f2ed" stroke="#6f9a85" stroke-width="2"/>
  </g>

  <g class="sans">
    <text class="cardTitle" x="108" y="220">Search set</text>
    <text class="cardSub" x="108" y="252">用来产生修改证据</text>
    <circle cx="118" cy="300" r="6" fill="#4f7ca2"/><text class="body" x="138" y="307">轨迹或反馈可提供给 optimizer</text>
    <circle cx="118" cy="350" r="6" fill="#4f7ca2"/><text class="body" x="138" y="357">直接影响候选怎样生成</text>
    <circle cx="118" cy="400" r="6" fill="#4f7ca2"/><text class="body" x="138" y="407">适合诊断、搜索和迭代</text>
    <rect x="108" y="438" width="246" height="38" rx="19" fill="#d9e8f2"/><text class="chip" x="136" y="463">轨迹暴露给修改者</text>

    <text class="cardTitle" x="629" y="220">Gate set</text>
    <text class="cardSub" x="629" y="252">用来决定晋升与回滚</text>
    <circle cx="639" cy="300" r="6" fill="#c28f35"/><text class="body" x="659" y="307">轨迹可以不向 proposer 暴露</text>
    <circle cx="639" cy="350" r="6" fill="#c28f35"/><text class="body" x="659" y="357">分数会在每轮反复使用</text>
    <circle cx="639" cy="400" r="6" fill="#c28f35"/><text class="body" x="659" y="407">已经参与版本选择</text>
    <rect x="629" y="438" width="264" height="38" rx="19" fill="#f4e3b9"/><text class="chip" x="657" y="463">不能当作最终测试</text>

    <text class="cardTitle" x="1150" y="220">Final test</text>
    <text class="cardSub" x="1150" y="252">用来报告最终泛化</text>
    <circle cx="1160" cy="300" r="6" fill="#5d8d78"/><text class="body" x="1180" y="307">搜索结束前保持独立</text>
    <circle cx="1160" cy="350" r="6" fill="#5d8d78"/><text class="body" x="1180" y="357">不决定候选生成与晋升</text>
    <circle cx="1160" cy="400" r="6" fill="#5d8d78"/><text class="body" x="1180" y="407">最接近未触碰的测试</text>
    <rect x="1150" y="438" width="276" height="38" rx="19" fill="#d9e9e1"/><text class="chip" x="1178" y="463">只在最终报告时启用</text>
  </g>

  <g class="sans">
    <rect x="74" y="548" width="1452" height="154" rx="26" fill="#fffdf8" stroke="#cfc7bc" stroke-width="2"/>
    <text class="budgetHead" x="108" y="592">比较候选时还要配平预算</text>
    <rect x="108" y="618" width="256" height="48" rx="24" fill="#ece7de"/><text class="chip" x="136" y="649">相同起始模型与 Harness</text>
    <rect x="384" y="618" width="246" height="48" rx="24" fill="#ece7de"/><text class="chip" x="414" y="649">inference 与 feedback</text>
    <rect x="650" y="618" width="224" height="48" rx="24" fill="#ece7de"/><text class="chip" x="681" y="649">配对种子与 verifier</text>
    <rect x="894" y="618" width="240" height="48" rx="24" fill="#ece7de"/><text class="chip" x="924" y="649">同一环境与任务切分</text>
    <rect x="1154" y="618" width="260" height="48" rx="24" fill="#ece7de"/><text class="chip" x="1184" y="649">相同最终测试预算</text>
    <text class="note" x="108" y="742">held-out 只有在不参与生成和晋升时，才接近完全未触碰的最终测试。</text>
  </g>
</svg>
