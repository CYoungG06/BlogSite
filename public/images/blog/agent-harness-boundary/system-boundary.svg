<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" aria-labelledby="title desc" role="img" viewBox="0 0 1600 960"><title id="title">Harness 是一条会移动的系统边界</title><desc id="desc">五层 Agent 系统中，工业产品覆盖行为层、运行时和产品层，传统学术 target harness 主要覆盖行为层与部分运行时，外层研究系统位于改进层。2026 年的研究范围继续扩展到运行时、训练与安全。</desc><defs><filter id="shadow" width="120%" height="130%" x="-10%" y="-10%"><feDropShadow dx="0" dy="6" flood-color="#26231f" flood-opacity=".1" stdDeviation="10"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#4d4740" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.sans{font-family:&quot;Noto Sans SC&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif}.title{font-size:42px;font-weight:760;fill:#201d19;letter-spacing:.4px}.subtitle{font-size:22px;fill:#6a6258}.level,.name{font-size:28px;font-weight:760;fill:#201d19}.name{font-size:25px;font-weight:650}.body{font-size:20px;fill:#4e4942}.small{font-size:18px;fill:#5d564e}.tag{font-size:19px;font-weight:700}</style></defs><rect width="1600" height="960" fill="#f7f3ea"/><circle cx="1510" cy="84" r="190" fill="#df6c4f" opacity=".08"/><circle cx="75" cy="900" r="220" fill="#4d7da8" opacity=".07"/><text x="82" y="84" class="sans title">Harness 是一条会移动的系统边界</text><text x="84" y="126" class="sans subtitle">同一套 Agent 系统，不同讨论截取不同责任和可编辑范围</text><g filter="url(#shadow)"><rect width="1010" height="102" x="92" y="186" fill="#ead9d2" stroke="#c88775" stroke-width="2" rx="18"/><rect width="1010" height="102" x="92" y="302" fill="#dce7f1" stroke="#7193b1" stroke-width="2" rx="18"/><rect width="1010" height="102" x="92" y="418" fill="#dcebe5" stroke="#6f9b88" stroke-width="2" rx="18"/><rect width="1010" height="102" x="92" y="534" fill="#f2e3b9" stroke="#bd9751" stroke-width="2" rx="18"/><rect width="1010" height="102" x="92" y="650" fill="#e6e1ef" stroke="#9584ad" stroke-width="2" rx="18"/></g><g class="sans"><text x="126" y="230" class="level">L4</text><text x="210" y="226" class="name">改进层</text><text x="210" y="260" class="body">traces、eval、失败归类、候选搜索、回归门禁、版本晋升与回滚</text><text x="126" y="346" class="level">L3</text><text x="210" y="342" class="name">产品层</text><text x="210" y="376" class="body">CLI、IDE、Web、认证、审批、协议、兼容性、可观测性与成本治理</text><text x="126" y="462" class="level">L2</text><text x="210" y="458" class="name">Agent runtime</text><text x="210" y="492" class="body">工具执行、sandbox、session、checkpoint、并发、重试、压缩与持久化</text><text x="126" y="578" class="level">L1</text><text x="210" y="574" class="name">行为层</text><text x="210" y="608" class="body">prompt、上下文、工具定义、memory、planning、routing、verification 与 agent loop</text><text x="126" y="694" class="level">L0</text><text x="210" y="690" class="name">模型</text><text x="210" y="724" class="body">权重、推理能力、训练与后训练</text></g><g class="sans"><path fill="none" stroke="#315f87" stroke-linecap="round" stroke-width="6" d="M1160 306 h26 M1186 306 v330 M1160 636 h26"/><rect width="298" height="154" x="1215" y="394" fill="#dbe7f2" stroke="#315f87" stroke-width="2" rx="20"/><text x="1244" y="434" fill="#315f87" class="tag">工业产品 Harness</text><text x="1244" y="472" class="small">主要横跨 L1 到 L3</text><text x="1244" y="504" class="small">边界跟随工程责任</text><path fill="none" stroke="#3e8068" stroke-linecap="round" stroke-width="6" d="M1148 510 h22 M1170 510 v126 M1148 636 h22"/><rect width="298" height="108" x="1215" y="574" fill="#dcebe5" stroke="#3e8068" stroke-width="2" rx="20"/><text x="1244" y="614" fill="#2d7159" class="tag">传统学术 target</text><text x="1244" y="650" class="small">集中在 L1 与少量 L2</text><path fill="none" stroke="#a4513f" stroke-linecap="round" stroke-width="6" d="M1148 186 h22 M1170 186 v102 M1148 288 h22"/><rect width="298" height="94" x="1215" y="190" fill="#ead9d2" stroke="#a4513f" stroke-width="2" rx="20"/><text x="1244" y="229" fill="#934535" class="tag">Meta 与 Evaluation</text><text x="1244" y="260" class="small">主要贡献常位于 L4</text></g><g class="sans"><text x="94" y="820" class="small">学术可编辑范围的扩展</text><line x1="310" x2="1460" y1="814" y2="814" stroke="#4d4740" stroke-width="3" marker-end="url(#arrow)"/><rect width="230" height="58" x="330" y="786" fill="#f2e3b9" rx="29"/><text x="365" y="823" fill="#7a5b22" class="tag">prompt 与 workflow</text><rect width="300" height="58" x="650" y="786" fill="#dcebe5" rx="29"/><text x="687" y="823" fill="#2d7159" class="tag">tools、memory、middleware</text><rect width="360" height="82" x="1040" y="774" fill="#ead9d2" rx="34"/><text x="1082" y="810" fill="#934535" class="tag">runtime、optimizer、训练与安全</text><text x="1164" y="839" class="small">2026</text></g><text x="94" y="908" class="sans small">本文分析框架 颜色表示讨论范围，不表示领域已有统一标准</text></svg>