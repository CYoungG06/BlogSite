<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Harness 是一条会移动的系统边界</title>
  <desc id="desc">五层 Agent 系统中，工业产品覆盖行为层、运行时和产品层，传统学术 target harness 主要覆盖行为层与部分运行时，外层研究系统位于改进层。2026 年的研究范围继续扩展到运行时、训练与安全。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#26231f" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4d4740"/>
    </marker>
    <style>
      .sans { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      .title { font-size: 42px; font-weight: 760; fill: #201d19; letter-spacing: 0.4px; }
      .subtitle { font-size: 22px; fill: #6a6258; }
      .level { font-size: 28px; font-weight: 760; fill: #201d19; }
      .name { font-size: 25px; font-weight: 650; fill: #201d19; }
      .body { font-size: 20px; fill: #4e4942; }
      .small { font-size: 18px; fill: #5d564e; }
      .tag { font-size: 19px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="960" fill="#f7f3ea"/>
  <circle cx="1510" cy="84" r="190" fill="#df6c4f" opacity="0.08"/>
  <circle cx="75" cy="900" r="220" fill="#4d7da8" opacity="0.07"/>

  <text class="sans title" x="82" y="84">Harness 是一条会移动的系统边界</text>
  <text class="sans subtitle" x="84" y="126">同一套 Agent 系统，不同讨论截取不同责任和可编辑范围</text>

  <g filter="url(#shadow)">
    <rect x="92" y="186" width="1010" height="102" rx="18" fill="#ead9d2" stroke="#c88775" stroke-width="2"/>
    <rect x="92" y="302" width="1010" height="102" rx="18" fill="#dce7f1" stroke="#7193b1" stroke-width="2"/>
    <rect x="92" y="418" width="1010" height="102" rx="18" fill="#dcebe5" stroke="#6f9b88" stroke-width="2"/>
    <rect x="92" y="534" width="1010" height="102" rx="18" fill="#f2e3b9" stroke="#bd9751" stroke-width="2"/>
    <rect x="92" y="650" width="1010" height="102" rx="18" fill="#e6e1ef" stroke="#9584ad" stroke-width="2"/>
  </g>

  <g class="sans">
    <text class="level" x="126" y="230">L4</text>
    <text class="name" x="210" y="226">改进层</text>
    <text class="body" x="210" y="260">traces、eval、失败归类、候选搜索、回归门禁、版本晋升与回滚</text>

    <text class="level" x="126" y="346">L3</text>
    <text class="name" x="210" y="342">产品层</text>
    <text class="body" x="210" y="376">CLI、IDE、Web、认证、审批、协议、兼容性、可观测性与成本治理</text>

    <text class="level" x="126" y="462">L2</text>
    <text class="name" x="210" y="458">Agent runtime</text>
    <text class="body" x="210" y="492">工具执行、sandbox、session、checkpoint、并发、重试、压缩与持久化</text>

    <text class="level" x="126" y="578">L1</text>
    <text class="name" x="210" y="574">行为层</text>
    <text class="body" x="210" y="608">prompt、上下文、工具定义、memory、planning、routing、verification 与 agent loop</text>

    <text class="level" x="126" y="694">L0</text>
    <text class="name" x="210" y="690">模型</text>
    <text class="body" x="210" y="724">权重、推理能力、训练与后训练</text>
  </g>

  <g class="sans">
    <path d="M1160 306 h26 M1186 306 v330 M1160 636 h26" fill="none" stroke="#315f87" stroke-width="6" stroke-linecap="round"/>
    <rect x="1215" y="394" width="298" height="154" rx="20" fill="#dbe7f2" stroke="#315f87" stroke-width="2"/>
    <text class="tag" x="1244" y="434" fill="#315f87">工业产品 Harness</text>
    <text class="small" x="1244" y="472">主要横跨 L1 到 L3</text>
    <text class="small" x="1244" y="504">边界跟随工程责任</text>

    <path d="M1148 510 h22 M1170 510 v126 M1148 636 h22" fill="none" stroke="#3e8068" stroke-width="6" stroke-linecap="round"/>
    <rect x="1215" y="574" width="298" height="108" rx="20" fill="#dcebe5" stroke="#3e8068" stroke-width="2"/>
    <text class="tag" x="1244" y="614" fill="#2d7159">传统学术 target</text>
    <text class="small" x="1244" y="650">集中在 L1 与少量 L2</text>

    <path d="M1148 186 h22 M1170 186 v102 M1148 288 h22" fill="none" stroke="#a4513f" stroke-width="6" stroke-linecap="round"/>
    <rect x="1215" y="190" width="298" height="94" rx="20" fill="#ead9d2" stroke="#a4513f" stroke-width="2"/>
    <text class="tag" x="1244" y="229" fill="#934535">Meta 与 Evaluation</text>
    <text class="small" x="1244" y="260">主要贡献常位于 L4</text>
  </g>

  <g class="sans">
    <text class="small" x="94" y="820">学术可编辑范围的扩展</text>
    <line x1="310" y1="814" x2="1460" y2="814" stroke="#4d4740" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="330" y="786" width="230" height="58" rx="29" fill="#f2e3b9"/>
    <text class="tag" x="365" y="823" fill="#7a5b22">prompt 与 workflow</text>
    <rect x="650" y="786" width="300" height="58" rx="29" fill="#dcebe5"/>
    <text class="tag" x="687" y="823" fill="#2d7159">tools、memory、middleware</text>
    <rect x="1040" y="774" width="360" height="82" rx="34" fill="#ead9d2"/>
    <text class="tag" x="1082" y="810" fill="#934535">runtime、optimizer、训练与安全</text>
    <text class="small" x="1164" y="839">2026</text>
  </g>

  <text class="sans small" x="94" y="908">本文分析框架　颜色表示讨论范围，不表示领域已有统一标准</text>
</svg>
