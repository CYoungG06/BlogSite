<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" aria-labelledby="title desc" role="img" viewBox="0 0 1600 1020"><title id="title">近两年 Harness 研究地图</title><desc id="desc">按照真正被修改或测量的对象，将代表工作分成 Harness 设计、能力评测、持续适应、训练优化器或模型、联合更新、安全与递归六类，并列出常见固定外层。</desc><defs><filter id="shadow" width="120%" height="140%" x="-10%" y="-10%"><feDropShadow dx="0" dy="5" flood-color="#2b2926" flood-opacity=".1" stdDeviation="8"/></filter><style>.sans{font-family:&quot;Noto Sans SC&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif}.title{font-size:42px;font-weight:760;fill:#211f1b}.head,.subtitle{font-size:20px}.subtitle{fill:#6d665d}.head{font-weight:720;fill:#5d574f}.rowTitle{font-size:24px;font-weight:760;fill:#24211d}.rowNote{font-size:18px;fill:#5f5951}.chip,.chipSmall{font-size:18px;font-weight:670;fill:#2c2925}.chipSmall{font-size:16px}.fixed{font-size:18px;fill:#4f4a44}</style></defs><rect width="1600" height="1020" fill="#f7f3ea"/><circle cx="1510" cy="85" r="180" fill="#4f7ca2" opacity=".06"/><circle cx="80" cy="970" r="190" fill="#d36b50" opacity=".05"/><text x="74" y="76" class="sans title">近两年 Harness 研究地图</text><text x="76" y="116" class="sans subtitle">论文名称很相似，真正的差别在于它修改谁，以及哪些外层仍然固定</text><text x="84" y="166" class="sans head">研究问题</text><text x="410" y="166" class="sans head">代表工作</text><text x="1225" y="166" class="sans head">常见固定外层</text><g class="sans" filter="url(#shadow)"><rect width="1460" height="116" x="70" y="188" fill="#fffdf8" stroke="#d3cbc0" rx="22"/><rect width="12" height="116" x="70" y="188" fill="#c9953e" rx="6"/><text x="104" y="231" class="rowTitle">设计与搜索 Harness</text><text x="104" y="264" class="rowNote">从 action filter 到完整代码</text><g><rect width="174" height="48" x="410" y="218" fill="#f2e1b8" rx="24"/><text x="439" y="249" class="chip">AutoHarness</text><rect width="186" height="48" x="600" y="218" fill="#f2e1b8" rx="24"/><text x="626" y="249" class="chip">Meta-Harness</text><rect width="112" height="48"