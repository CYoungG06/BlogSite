<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">近两年 Harness 研究地图</title>
  <desc id="desc">按照真正被修改或测量的对象，将代表工作分成 Harness 设计、能力评测、持续适应、训练优化器或模型、联合更新、安全与递归六类，并列出常见固定外层。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#2b2926" flood-opacity="0.1"/>
    </filter>
    <style>
      .sans { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
      .title { font-size: 42px; font-weight: 760; fill: #211f1b; }
      .subtitle { font-size: 20px; fill: #6d665d; }
      .head { font-size: 20px; font-weight: 720; fill: #5d574f; }
      .rowTitle { font-size: 24px; font-weight: 760; fill: #24211d; }
      .rowNote { font-size: 18px; fill: #5f5951; }
      .chip { font-size: 18px; font-weight: 670; fill: #2c2925; }
      .chipSmall { font-size: 16px; font-weight: 670; fill: #2c2925; }
      .fixed { font-size: 18px; fill: #4f4a44; }
    </style>
  </defs>

  <rect width="1600" height="1020" fill="#f7f3ea"/>
  <circle cx="1510" cy="85" r="180" fill="#4f7ca2" opacity="0.06"/>
  <circle cx="80" cy="970" r="190" fill="#d36b50" opacity="0.05"/>

  <text class="sans title" x="74" y="76">近两年 Harness 研究地图</text>
  <text class="sans subtitle" x="76" y="116">论文名称很相似，真正的差别在于它修改谁，以及哪些外层仍然固定</text>

  <text class="sans head" x="84" y="166">研究问题</text>
  <text class="sans head" x="410" y="166">代表工作</text>
  <text class="sans head" x="1225" y="166">常见固定外层</text>

  <g filter="url(#shadow)" class="sans">
    <rect x="70" y="188" width="1460" height="116" rx="22" fill="#fffdf8" stroke="#d3cbc0"/>
    <rect x="70" y="188" width="12" height="116" rx="6" fill="#c9953e"/>
    <text class="rowTitle" x="104" y="231">设计与搜索 Harness</text>
    <text class="rowNote" x="104" y="264">从 action filter 到完整代码</text>
    <g>
      <rect x="410" y="218" width="174" height="48" rx="24" fill="#f2e1b8"/><text class="chip" x="439" y="249">AutoHarness</text>
      <rect x="600" y="218" width="186" height="48" rx="24" fill="#f2e1b8"/><text class="chip" x="626" y="249">Meta-Harness</text>
      <rect x="802" y="218" width="112" height="48" rx="24" fill="#f2e1b8"/><text class="chip" x="838" y="249">AHE</text>
      <rect x="930" y="218" width="188" height="48" rx="24" fill="#f2e1b8"/><text class="chip" x="959" y="249">HarnessCompass</text>
    </g>
    <text class="fixed" x="1225" y="232">模型与任务分布</text>
    <text class="fixed" x="1225" y="262">产品发布责任</text>

    <rect x="70" y="320" width="1460" height="116" rx="22" fill="#fffdf8" stroke="#d3cbc0"/>
    <rect x="70" y="320" width="12" height="116" rx="6" fill="#4f7ca2"/>
    <text class="rowTitle" x="104" y="363">测量能力与增益</text>
    <text class="rowNote" x="104" y="396">组合、预算与泛化</text>
    <g>
      <rect x="410" y="350" width="112" height="48" rx="24" fill="#dce8f2"/><text class="chip" x="445" y="381">VeRO</text>
      <rect x="538" y="350" width="180" height="48" rx="24" fill="#dce8f2"/><text class="chip" x="567" y="381">Harness-Bench</text>
      <rect x="734" y="350" width="170" height="48" rx="24" fill="#dce8f2"/><text class="chipSmall" x="748" y="380">Updating / Benefit</text>
      <rect x="920" y="350" width="160" height="48" rx="24" fill="#dce8f2"/><text class="chip" x="954" y="381">Re-evaluation</text>
      <rect x="1096" y="350" width="72" height="48" rx="24" fill="#dce8f2"/><text class="chip" x="1112" y="381">Shor</text>
    </g>
    <text class="fixed" x="1225" y="364">数据切分与预算</text>
    <text class="fixed" x="1225" y="394">verifier 与最终测试</text>

    <rect x="70" y="452" width="1460" height="116" rx="22" fill="#fffdf8" stroke="#d3cbc0"/>
    <rect x="70" y="452" width="12" height="116" rx="6" fill="#5d8d78"/>
    <text class="rowTitle" x="104" y="495">持续与分布式适应</text>
    <text class="rowNote" x="104" y="528">积累、业务变化与本地 patch</text>
    <g>
      <rect x="410" y="482" width="198" height="48" rx="24" fill="#dcebe4"/><text class="chip" x="438" y="513">Continual Harness</text>
      <rect x="624" y="482" width="232" height="48" rx="24" fill="#dcebe4"/><text class="chip" x="650" y="513">Adaptive Auto-Harness</text>
      <rect x="872" y="482" width="136" height="48" rx="24" fill="#dcebe4"/><text class="chip" x="906" y="513">TaoLive</text>
      <rect x="1024" y="482" width="144" height="48" rx="24" fill="#dcebe4"/><text class="chip" x="1055" y="513">EvolveNet</text>
    </g>
    <text class="fixed" x="1225" y="496">路由、开发者门禁</text>
    <text class="fixed" x="1225" y="526">teacher 或中央聚合规则</text>

    <rect x="70" y="584" width="1460" height="116" rx="22" fill="#fffdf8" stroke="#d3cbc0"/>
    <rect x="70" y="584" width="12" height="116" rx="6" fill="#8a79a7"/>
    <text class="rowTitle" x="104" y="627">训练 optimizer 或模型</text>
    <text class="rowNote" x="104" y="660">修改者与使用者分开学习</text>
    <g>
      <rect x="410" y="614" width="166" height="48" rx="24" fill="#e8e1ef"/><text class="chip" x="443" y="645">Harness-R1</text>
      <rect x="592" y="614" width="190" height="48" rx="24" fill="#e8e1ef"/><text class="chip" x="620" y="645">EvoHarness-RL</text>
      <rect x="798" y="614" width="166" height="48" rx="24" fill="#e8e1ef"/><text class="chip" x="833" y="645">ClawGym II</text>
    </g>
    <text class="fixed" x="1225" y="628">target 或黑盒 Harness</text>
    <text class="fixed" x="1225" y="658">reward protocol</text>

    <rect x="70" y="716" width="1460" height="116" rx="22" fill="#fffdf8" stroke="#d3cbc0"/>
    <rect x="70" y="716" width="12" height="116" rx="6" fill="#d36b50"/>
    <text class="rowTitle" x="104" y="759">模型与 Harness 联合更新</text>
    <text class="rowNote" x="104" y="792">Harness 参与训练数据生成</text>
    <g>
      <rect x="410" y="746" width="96" height="48" rx="24" fill="#f0ddd6"/><text class="chip" x="444" y="777">SIA</text>
      <rect x="522" y="746" width="166" height="48" rx="24" fill="#f0ddd6"/><text class="chip" x="553" y="777">Co-Harness</text>
    </g>
    <text class="fixed" x="1225" y="760">外层目标与门禁</text>
    <text class="fixed" x="1225" y="790">训练或聚合协议</text>

    <rect x="70" y="848" width="1460" height="116" rx="22" fill="#fffdf8" stroke="#d3cbc0"/>
    <rect x="70" y="848" width="12" height="116" rx="6" fill="#3f6c67"/>
    <text class="rowTitle" x="104" y="891">安全与递归边界</text>
    <text class="rowNote" x="104" y="924">谁拥有权限、评测和下一轮改进权</text>
    <g>
      <rect x="410" y="878" width="160" height="48" rx="24" fill="#dce9e6"/><text class="chip" x="440" y="909">HarnessSafe</text>
      <rect x="586" y="878" width="150" height="48" rx="24" fill="#dce9e6"/><text class="chip" x="618" y="909">HarnessRisk</text>
      <rect x="752" y="878" width="172" height="48" rx="24" fill="#dce9e6"/><text class="chip" x="781" y="909">Self-Harness</text>
      <rect x="940" y="878" width="104" height="48" rx="24" fill="#dce9e6"/><text class="chip" x="975" y="909">HSI</text>
      <rect x="1060" y="878" width="96" height="48" rx="24" fill="#dce9e6"/><text class="chip" x="1091" y="909">DGM</text>
    </g>
    <text class="fixed" x="1225" y="892">权限、evaluator 与 anchor</text>
    <text class="fixed" x="1225" y="922">仍由外部机制掌管</text>
  </g>
</svg>
