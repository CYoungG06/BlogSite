<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" aria-labelledby="title desc" role="img" viewBox="0 0 1600 980"><title id="title">模型、Harness、Optimizer 与 Evaluator 的改进回路</title><desc id="desc">模型与 target harness 在环境中执行并产生轨迹。Evaluation harness 运行和记录，verifier 给出指标，optimizer 根据证据提出候选 Harness，晋升规则决定是否成为下一代。验证轨迹可以训练模型，失败、补丁和重跑数据可以训练 optimizer。任务分布、奖励协议、预算和人工审批常保持固定。</desc><defs><filter id="shadow" width="124%" height="140%" x="-12%" y="-12%"><feDropShadow dx="0" dy="6" flood-color="#171512" flood-opacity=".11" stdDeviation="9"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#504a43" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrowBlue" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#376e99" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="arrowRed" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#a4503c" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.sans{font-family:&quot;Noto Sans SC&quot;,&quot;PingFang SC&quot;,&quot;Microsoft YaHei&quot;,system-ui,sans-serif}.title{font-size:40px;font-weight:760;fill:#201d19}.subtitle{font-size:21px;fill:#6a6258}.nodeTitle{font-size:25px;font-weight:760;fill:#201d19}.label,.nodeBody{font-size:18px;fill:#4e4942}.pill{font-size:18px}.label{font-weight:650}.pill{font-weight:680;fill:#5d564e}.note{font-size:17px;fill:#6a6258}.dashBlue,.dashRed,.solid{fill:none;stroke-width:3.2}.solid{stroke:#504a43;marker-end:url(#arrow)}.dashBlue,.dashRed{stroke:#376e99;stroke-dasharray:10 9;marker-end:url(#arrowBlue)}.dashRed{stroke:#a4503c;marker-end:url(#arrowRed)}</style></defs><rect width="1600" height="980" fill="#f7f3ea"/><circle cx="1500" cy="100" r="190" fill="#4d7da8" opacity=".07"/><circle cx="70" cy="920" r="210" fill="#df6c4f" opacity=".07"/><text x="78" y="78" class="sans title">模型、Harness、Optimizer 与 Evaluator 的改进回路</text><text x="80" y="118" class="sans subtitle">论文名称相近，差别来自它们更新哪个节点，以及哪些外层条件仍然固定</text><rect width="1476" height="748" x="62" y="150" fill="none" stroke="#aaa196" stroke-dasharray="12 10" stroke-width="2.5" rx="28"/><text x="92" y="184" class="sans note">很多实验固定的外层条件</text><g class="sans"><rect width="220" height="50" x="330" y="166" fill="#ede8de" stroke="#b8aea2" rx="25"/><text x="374" y="198" class="pill">任务分布 𝒟</text><rect width="220" height="50" x="580" y="166" fill="#ede8de" stroke="#b8aea2" rx="25"/><text x="633" y="198" class="pill">预算向量 B</text><rect width="250" height="50" x="830" y="166" fill="#ede8de" stroke="#b8aea2" rx="25"/><text x="875" y="198" class="pill">Verifier 与奖励协议</text><rect width="260" height="50" x="1110" y="166" fill="#ede8de" stroke="#b8aea2" rx="25"/><text x="1165" y="198" class="pill">人工审批与发布规则</text></g><g class="sans" filter="url(#shadow)"><rect width="255" height="112" x="105" y="286" fill="#dce7f1" stroke="#527fa3" stroke-width="2" rx="22"/><text x="153" y="330" class="nodeTitle">模型 Mθ</text><text x="139" y="365" class="nodeBody">生成原始输出与决策</text><rect width="285" height="112" x="425" y="286" fill="#f2e3b9" stroke="#b68d42" stroke-width="2" rx="22"/><text x="487" y="330" class="nodeTitle">Target Harness Hη</text><text x="467" y="365" class="nodeBody">上下文、动作、状态与停止</text><rect width="310" height="132" x="870" y="276" fill="#dcebe5" stroke="#5b917a" stroke-width="2" rx="22"/><text x="958" y="323" class="nodeTitle">环境 𝒲</text><text x="918" y="358" class="nodeBody">任务、工具、workspace</text><text x="946" y="383" class="nodeBody">产生观察与副作用</text><rect width="340" height="116" x="790" y="492" fill="#e7ecea" stroke="#6f887d" stroke-width="2" rx="22"/><text x="868" y="535" class="nodeTitle">轨迹与 Archive</text><text x="839" y="571" class="nodeBody">上下文、动作、观察、结果与历史版本</text><rect width="285" height="116" x="430" y="492" fill="#ead9d2" stroke="#b36856" stroke-width="2" rx="22"/><text x="476" y="535" class="nodeTitle">Evaluation 𝒬 与 V</text><text x="474" y="571" class="nodeBody">隔离运行、记录、评分与预算</text><rect width="255" height="116" x="105" y="492" fill="#e6e1ef" stroke="#8b78a5" stroke-width="2" rx="22"/><text x="161" y="535" class="nodeTitle">Optimizer Oφ</text><text x="145" y="571" class="nodeBody">诊断失败并提出修改</text><rect width="255" height="110" x="105" y="692" fill="#eee8f4" stroke="#8b78a5" stroke-width="2" rx="22"/><text x="157" y="735" class="nodeTitle">候选 Harness H̃</text><text x="148" y="770" class="nodeBody">可执行 patch 与修改说明</text><rect width="285" height="110" x="430" y="692" fill="#f0ded7" stroke="#a4503c" stroke-width="2" rx="22"/><text x="504" y="735" class="nodeTitle">晋升规则 Γ</text><text x="470" y="770" class="nodeBody">回归门禁、接受、回滚</text><rect width="260" height="126" x="1210" y="482" fill="#dce7f1" stroke="#527fa3" stroke-width="2" rx="22"/><text x="1275" y="526" class="nodeTitle">训练模型</text><text x="1250" y="560" class="nodeBody">验证后的 Harness 轨迹</text><text x="1273" y="586" class="nodeBody">更新 θ</text><rect width="260" height="134" x="1210" y="680" fill="#ead9d2" stroke="#b36856" stroke-width="2" rx="22"/><text x="1266" y="713" class="nodeTitle">训练 Harness</text><text x="1292" y="741" class="nodeTitle">Engineer</text><text x="1242" y="769" class="nodeBody">failure、patch 与 rerun</text><text x="1270" y="796" class="nodeBody">更新 φ</text></g><path d="M360 330 C388 330 398 330 425 330" class="solid"/><text x="382" y="314" class="sans label">配合</text><path d="M710 342 C765 342 808 342 870 342" class="solid"/><text x="748" y="326" class="sans label">执行动作</text><path d="M1025 408 C1025 444 1000 461 974 492" class="solid"/><text x="1038" y="455" class="sans label">记录 τ</text><path d="M790 550 C760 550 746 550 715 550" class="solid"/><text x="733" y="532" class="sans label">送入评测</text><path d="M430 550 C403 550 388 550 360 550" class="solid"/><text x="383" y="532" class="sans label">证据</text><path d="M232 608 L232 692" class="solid"/><text x="250" y="655" class="sans label">提出 δ</text><path d="M360 720 C394 695 397 625 430 590" class="solid"/><text x="345" y="640" class="sans label">固定模型与环境重跑</text><text x="391" y="664" class="sans label">再进入评测</text><path d="M572 608 L572 692" class="solid"/><text x="590" y="655" class="sans label">指标与回归证据</text><path d="M715 747 C770 747 788 690 760 630 C730 566 738 438 632 398" class="solid"/><text x="760" y="686" class="sans label">晋升为下一代 η</text><path d="M1130 548 C1160 548 1175 548 1210 548" class="dashBlue"/><path d="M1340 482 C1340 382 1225 258 350 260 C255 260 232 276 232 286" class="dashBlue"/><text x="1180" y="529" fill="#376e99" class="sans label">训练数据</text><path d="M1130 582 C1190 612 1210 662 1210 720" class="dashRed"/><path d="M1210 770 C1040 850 500 865 250 610" class="dashRed"/><text x="1120" y="658" fill="#a4503c" class="sans label">编辑数据</text><text x="90" y="938" class="sans note">实线表示执行与版本晋升 虚线表示可选训练回流 不同论文只关闭其中一部分关系</text></svg>